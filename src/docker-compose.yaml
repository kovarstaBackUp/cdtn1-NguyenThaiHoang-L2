services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstoneone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Chay mot lan khi volume con trong, de tao database test bang compose chu
      # khong phai bang tay. Xem src/docker/init/01-capstoneone-test.sql.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  init:
    build:
      context: .
      target: build
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/capstoneone
    command:
      - sh
      - -c
      - pnpm run db:init && pnpm run db:seed && DATABASE_URL=postgresql://postgres:postgres@db:5432/capstoneone_test pnpm run db:init && DATABASE_URL=postgresql://postgres:postgres@db:5432/capstoneone_test pnpm run db:seed
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/capstoneone
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      init:
        condition: service_completed_successfully

  # Chay bo test ben trong container, dung cho buoc "Verify it works" cua
  # Deployment Guide va phep thu may trang. Anh runner khong co vitest va khong
  # co thu muc tests/, nen phai dung lai tang build giong dich vu init.
  # Chay: docker compose run --rm test
  test:
    build:
      context: .
      target: build
    restart: 'no'
    # Khong chay khi `docker compose up`. Chi chay khi duoc goi ten:
    #   docker compose run --rm test
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/capstoneone
      TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/capstoneone_test
    command: pnpm run test
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres-data:
